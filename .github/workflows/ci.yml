name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sanitize-guard:
    name: Sanitize guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on unsanitized strings
        run: |
          # NB: .github is excluded because this workflow file itself
          # contains the guard patterns as data.
          if grep -rliE "upco|\bnbc\b|comcast|peacock|nbcuniversal" . --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::Unsanitized string found in the tree"
            exit 1
          fi
          echo "Sanitize guard clean"

  scraper-readonly:
    name: Scraper read-only guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scraper must be strictly read-only
        run: sh scripts/check-scraper-readonly.sh
      - name: Guard rejects every known mutation pattern
        run: bash tests/run_scraper_guard.sh

  dist-parity:
    name: dist parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild dist from source
        run: |
          sh scripts/build.zsh
          bash scripts/build-linux-test.sh
      - name: linux-test bundle must target zsh and parse
        run: |
          head -1 dist/mograph-jailed-linux-test.sh | grep -qx '#!/usr/bin/env zsh'
          sudo apt-get update && sudo apt-get install -y zsh
          zsh -n dist/mograph-jailed-linux-test.sh
          zsh -n dist/mograph-jailed.zsh
      - name: dist must match committed bundle
        run: git diff --exit-code -- dist/
      - name: installer checksum list must be current
        run: sh scripts/make-manifest.sh --check

  portable-tests:
    name: Portable tests + fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install zsh and ffmpeg
        # ffmpeg is test-fixture tooling only (generates sample media for
        # run_m3.sh); it is not a MographJailed runtime dependency.
        run: sudo apt-get update && sudo apt-get install -y zsh ffmpeg
      - name: Portable test suite
        run: bash tests/run_all.sh
      - name: Protocol fuzz (1000 cases)
        run: bash tests/qa_only/run_fuzz_1000.sh

  macos-tests:
    name: macOS tests
    runs-on: macos-latest
    # ponytail: advisory until the suite is proven green on hosted macOS; drop continue-on-error then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test-fixture tooling
        # ffmpeg only generates sample media for run_m3.sh; it is not a MographJailed runtime dependency.
        run: brew install ffmpeg
      - name: Test suite (stock /bin/zsh, BSD userland)
        run: bash tests/run_all.sh
