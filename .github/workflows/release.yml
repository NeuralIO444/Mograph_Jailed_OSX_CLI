name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the release zip
        run: |
          set -eu
          sh scripts/build.zsh
          grep -q 'handle_dimension_probe' dist/mograph-jailed.zsh
          sh scripts/make-release.sh release
          test -s release/MographJailed-*.zip
          ( cd release && sha256sum MographJailed-*.zip > SHA256SUMS )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          zip=$(echo release/MographJailed-*.zip)
          pre=""
          case "$tag" in
            *dev*|*alpha*|*beta*|*rc*) pre="--prerelease" ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" release/SHA256SUMS --clobber
          else
            gh release create "$tag" "$zip" release/SHA256SUMS \
              --title "MographJailed $tag" \
              $pre \
              --verify-tag \
              --notes "Install/Uninstall plus payload. Dimension prong calls a local dimension binary: probe, safezone, conform. No network."
          fi
